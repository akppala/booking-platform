  r2dbc:
    url: r2dbc:postgresql://host.docker.internal:5432/booking_platform
    username: postgres
    password: postgres
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://host.docker.internal:5432/booking_platform
    user: postgres
    password: postgres
    baseline-on-migrate: true

server:
  port: 8010

app:
  cors:
    # Use a comma-separated list for multiple frontend origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.flywaydb: TRACE
    org.springframework.r2dbc: DEBUG
    org.springframework.security: TRACE
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: catalog-service

  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true

    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://tempo.observability.svc.cluster.local:4318/v1/traces
