apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        version: v1
      annotations: 
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      #serviceAccountName: catalog-sa
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: catalog-service
        image: akppala/catalog-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8010
          name: http
          protocol: TCP
        # env:
        # - name: SPRING_PROFILES_ACTIVE
        #   value: "prod"
        # - name: SPRING_R2DBC_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: r2dbc-url
        # - name: SPRING_R2DBC_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: username
        # - name: SPRING_R2DBC_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: password
        # - name: SPRING_FLYWAY_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: flyway-url
        # - name: SPRING_FLYWAY_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: username
        # - name: SPRING_FLYWAY_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: password
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8010
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "500m"
