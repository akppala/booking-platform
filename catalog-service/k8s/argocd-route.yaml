apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
  annotations:
    ://konghq.com: "false"
spec:
  parentRefs:
    - name: local-gateway
      namespace: kong
  hostnames:
    - "argocd.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: "X-Forwarded-Proto"
                value: "https"
      backendRefs:
        - name: argocd-server
          kind: Service
          port: 80

