apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konga-route
  namespace: kong
spec:
  parentRefs:
    - name: kong

  hostnames:
    - konga.localhost

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: konga
          port: 1337
