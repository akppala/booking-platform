apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-route
  namespace: booking-platform 
spec:
  parentRefs:
    - name: kong
      namespace: kong

  hostnames:
    - catalog.localhost

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: catalog-service
          port: 8010
---
