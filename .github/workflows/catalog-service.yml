name: Catalog Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'catalog-service/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/catalog-service.yml'

  pull_request:
    paths:
      - 'catalog-service/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/catalog-service.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Catalog Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Catalog Service
        run: ./gradlew :catalog-service:clean build