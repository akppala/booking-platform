apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      serviceAccountName: inventory-sa
      containers:
      - name: inventory-service
        image: inventory-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8011
          name: http
          protocol: TCP
        # env:
        # - name: SPRING_PROFILES_ACTIVE
        #   value: "prod"
        # - name: SPRING_R2DBC_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: r2dbc-url
        # - name: SPRING_R2DBC_USERNAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: username
        # - name: SPRING_R2DBC_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: password
        # - name: SPRING_FLYWAY_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: flyway-url
        # - name: SPRING_FLYWAY_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: username
        # - name: SPRING_FLYWAY_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: password
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8011
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8011
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
